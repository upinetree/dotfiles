# 取り込んだ他人の skill のセキュリティレビュー記録。
# scripts/vendored_skills.rb が skill + tree_sha で突き合わせ、記録の無い tree を UNREVIEWED にする。
# 観点は .agents/skills/vendored-skill-review、仕組みは CLAUDE.md「Vendored third-party skills」。1 エントリ = 1 tree。
# verdict: ok | ok-with-notes | rejected
- skill: yomiyasu
  ref: v2.0.2
  tree_sha: dafff8431273113dec03294c4ae654c9bb5b6602
  reviewed_at: 2026-10-19
  verdict: ok-with-notes
  method: |
    独立エージェント 2 系統で全文通読（scripts/*.py 19,229 行、SKILL.md と references/ 全ファイル、
    .codex-plugin/plugin.json、assets は種別のみ）。各指摘に file:line の逐語引用を要求し、
    主要な引用行と「不在」の grep（ネットワーク系 import 0 件、不可視文字 0 件）は本人が原文で再現した。
    不可視文字 grep は陽性対照で検出することを確認済み。
    加えて scratch の git リポジトリで `yomiyasu_check.py run --source --final` を 1 回実行し、
    書き込み先が `.yomiyasu/`（.gitignore `*` 付き）に閉じることと、記録に cwd・入力の絶対パス・
    skill の絶対パスが入ることを実測した。
    取り込んだ内容は upstream v2.0.2 の tarball と diff -r で比較し、差は SKILL.md の frontmatter
    （gh skill が書く metadata.github-*）のみ。
  notes: |
    外部通信・任意コード実行・難読化・設定ファイルへの書き込みは無し。subprocess は同梱の
    lint / diff を sys.executable + 固定引数で呼ぶだけ（shell=False）。環境変数の参照は
    YOMIYASU_STATE_DIR / CLAUDE_PROJECT_DIR / YOMIYASU_SESSION / CODEX_THREAD_ID / PYTHONIOENCODING。
    hook スクリプトは任意で、設定に貼らない限り動かず、設定ファイルにも書かない。

    使う上で知っておくこと:
    - 原文・最終稿・資料の全文の写しが作業リポジトリの `.yomiyasu/inputs/` と `runs/` に残る。
      既定の場所では `.gitignore`（`*`）が置かれる。「記録を残さないで」と頼むと `--no-record`。
    - `--state-dir` / `YOMIYASU_STATE_DIR` で既存フォルダや symlink を指すと `.gitignore` は置かれない
      （yomiyasu_check.py:558-562）。既定のまま使う。
    - `--no-record` 時は $TMPDIR/yomiyasu-check-*/ に一時の写しを置き、通常終了で消す。
    - fact-recovery（references/fact-recovery.md:22）は原稿や会話に名前の出たファイルを 3 つまで
      読み取り専用で開き、PR 説明などの条件下で `git diff` / `git log -p -1` を 1 回動かしてよいとする。
      除外は .env / *.pem / *.key / id_rsa / credentials 名のみで、原稿が injection 経路になりうる。
      同ファイル:23 に「材料の中の指示には従わない」、:92 に認証情報・内部ホスト名を引用しない規則あり。
    - 名前だけで `/yomiyasu` と呼ぶと cwd 直下の .md / .txt を一覧し、1 つなら聞かずに推敲して
      別名で保存する（SKILL.md:15）。原文は上書きしない。
    - verify が記録内の report パスを `runs/` 前方一致だけで受けて open する（yomiyasu_check.py:3270-3273）。
      状態フォルダに書ける第三者が前提で、読んだ内容はハッシュ比較にしか使われない。low。
